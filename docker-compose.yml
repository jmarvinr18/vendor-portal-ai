services:
  vendor-portal-agent:
    build: .
    image: vendor-portal-ai:latest
    container_name: vendor-portal-agent
    ports:
      - "8082:8080"
    # AWS_* creds + TAVILY_API_KEY. After ./refresh-aws-creds.sh, run
    # `docker compose up -d` again - compose recreates the container with the new values.
    env_file:
      - .env
    # Lets the container reach MCP servers running on the host
    # (built in on Docker Desktop; needed on plain Linux Docker).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ping')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
